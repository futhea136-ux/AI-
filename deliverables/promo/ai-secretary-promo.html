<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 小秘宣传页</title>
  <style>
    body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; color: #15213b; background: #eef4fb; }
    .hero { min-height: 78vh; display: grid; place-items: center; padding: 48px 24px; background: linear-gradient(140deg, #10182f, #2869df); color: white; }
    .wrap { max-width: 1060px; width: 100%; }
    h1 { font-size: clamp(42px, 7vw, 84px); margin: 0 0 18px; }
    p { font-size: 20px; line-height: 1.8; color: #dbe6ff; max-width: 720px; }
    a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 12px; color: #174ca5; background: white; text-decoration: none; font-weight: 700; }
    section { max-width: 1060px; margin: 0 auto; padding: 42px 24px; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .feature { padding: 20px; border: 1px solid #dce4ef; border-radius: 14px; background: white; }
    .feature strong { display: block; margin-bottom: 8px; font-size: 18px; }
    .feature span { color: #71809a; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <h1>AI 小秘</h1>
      <p>会听、会记、会提醒。用一句话安排日程，同屏查看日历，所有数据保存在本机。</p>
      <a href="https://futhea136-ux.github.io/AI-/">立即体验免费原型</a>
    </div>
  </div>
  <section>
    <div class="features">
      <div class="feature"><strong>说话就能记</strong><span>语音或文字输入，自动整理成确认卡。</span></div>
      <div class="feature"><strong>日历同屏</strong><span>月视图、周视图和日程列表随时切换。</span></div>
      <div class="feature"><strong>本地优先</strong><span>不用账号、不用数据库，备份可手动导出。</span></div>
      <div class="feature"><strong>免费原型</strong><span>适合演示、试用和收集真实反馈。</span></div>
    </div>
  </section>
</body>
</html>
